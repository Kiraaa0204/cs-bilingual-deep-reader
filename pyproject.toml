[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-deep-reader"
version = "0.1.0"
description = "Local state and PDF extraction for bilingual CS textbook deep reading"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cs-deep-reader = "cs_deep_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
